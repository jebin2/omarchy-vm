# Dragon Ball Z — Goku's gi orange over warm charcoal, Super Saiyan gold,
# Kamehameha blue. Single source of truth: Omarchy generates foot, ghostty,
# alacritty, kitty, btop, neovim, helix, chromium, vscode, obsidian and the
# shell palette from these keys.
mode = "dark"

accent    = "#ff7a1a"
selection  = "#3d2f22"
muted      = "#4a3f36"

background         = "#171310"
dark_background    = "#100d0b"
darker_background  = "#0a0807"
lighter_background = "#231c17"

foreground        = "#ede4d6"
dark_foreground   = "#8a7868"
light_foreground  = "#d6c9b8"
bright_foreground = "#fff8ec"

red     = "#e8503c"
yellow  = "#ffc93c"
orange  = "#ff7a1a"
green   = "#7ec850"
cyan    = "#4fb8ff"
blue    = "#4a90e2"
magenta = "#b07ae0"
brown   = "#8a5a33"

bright_red     = "#ff6b52"
bright_yellow  = "#ffdb70"
bright_green   = "#9ade6f"
bright_cyan    = "#7fceff"
bright_blue    = "#6ba8f0"
bright_magenta = "#c99af0"

# The Super Saiyan aura: gi orange into gold. Consumed by hyprland.lua.tpl and
# shell.toml.tpl, so window borders, popups, notifications, the launcher and the
# lock input all share one gradient.
hyprland_active_border   = "#ff7a1a #ffc93c 45deg"
hyprland_inactive_border = "rgba(2e241c99)"
